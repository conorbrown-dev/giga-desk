services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: giga_desk
      POSTGRES_PASSWORD: giga_desk
      POSTGRES_USER: giga_desk
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giga_desk -d giga_desk"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - giga_desk_postgres:/var/lib/postgresql/data

  keycloak-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_USER: keycloak
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - giga_desk_keycloak_postgres:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak/realm-local.json:/opt/keycloak/data/import/giga-desk-realm.json:ro

volumes:
  giga_desk_postgres:
  giga_desk_keycloak_postgres:
