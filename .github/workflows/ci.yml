name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://giga_desk:giga_desk@127.0.0.1:5442/giga_desk?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start PostgreSQL and Keycloak
        run: |
          docker compose up -d postgres keycloak-postgres keycloak
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/realms/giga-desk/.well-known/openid-configuration >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs keycloak
          exit 1
      - name: Apply database migrations
        working-directory: apps/api
        run: npm exec prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:e2e
      - run: npm run build
