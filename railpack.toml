base = "node:22-alpine"

install = "npm install"
build = "npm run build"

# Copy source and install production dependencies
copy = [
  { from = ".", to = "/app", include = ["package.json", "package-lock.json", "apps/**/package.json", "apps/api/prisma.config.ts", "apps/api/prisma", "apps/web/dist", "dist"] }
]

run = "npm install --production"

# Copy built artifacts
copy = [
  { from = "/app/apps/api/dist", to = "/app/apps/api/dist" },
  { from = "/app/apps/api/prisma", to = "/app/apps/api/prisma" },
  { from = "/app/apps/web/dist", to = "/app/apps/web/dist" },
  { from = "/app/apps/api/package.json", to = "/app/apps/api/package.json" }
]

# Prisma setup
run = "cd /app/apps/api && npm run prisma:generate"

# Start command
entrypoint = ["node", "/app/apps/api/dist/main.js"]
